<!DOCTYPE html>
<html>

<head>
  <title>Ovoplayer Web Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" type="text/css" href="css/normalize.css">
  <link rel="stylesheet" type="text/css" href="css/skeleton.css">
  <link rel="stylesheet" type="text/css" href="css/styles.css">
  <link rel="stylesheet" type="text/css" href="css/ovoplayer-font.css">
  <script src="js/ovoplayer.js" defer></script>
</head>

<body onload="init();">
  <div class="container box">
    <!-- Enhanced Header with Status Bar -->
    <header class="header-status">
      <nav class="container navbar">
        <div class="status-section">
          <div class="status-indicator">
            <span class="status-dot" id="connectionDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
          </div>
        </div>
        <div class="controls-section">
          <button class="settings-btn" onclick="showbox('setup');" title="Settings">⚙️</button>
        </div>
      </nav>
    </header>

    <!-- Toast Notifications -->
    <div id="toast" class="cdialog toast-notification">...</div>

    <!-- Setup Dialog -->
    <div id="setup" class="cdialog">
      <button class="button-primary u-pull-right big" onclick="closebox('setup');">✕</button><br>
      <form>
        <fieldset>
          <legend>Connection Setup</legend>
          <label for="server">Host</label>
          <input id="server" placeholder="127.0.0.1" class="form-control input-md" required="" type="text">

          <label for="port">Port</label>
          <input id="port" name="port" placeholder="6860" class="form-control input-md" required="" type="text">

          <label class="inline-label"> <input id="SSL" type="checkbox"> Use SSL encryption </label>

          <button id="confirm" class="button-primary big" onclick='saveParams()' style="margin-top: 16px;">Connect</button>
          <button id="testConnection" class="button big" onclick='testConnection()' style="margin-top: 16px; margin-left: 8px;">Test Connection</button>

        </fieldset>
      </form>
    </div>

    <!-- Song Info Dialog -->
    <div id="songinfo" class="cdialog song-info-dialog">
      <button class="button-primary u-pull-right big" onclick="closebox('songinfo');">✕</button><br>
      <p><label>Title:</label><span id="i_tile">Title</span></p>
      <p><label>Album:</label><span id="i_album">Album</span></p>
      <p><label>Album Artist:</label><span id="i_albumartist">Album</span></p>
      <p><label>Artist:</label><span id="i_artist">Artist</span></p>
      <p><label>Track:</label><span id="i_track">TrackString</span></p>
      <p><label>Genre:</label><span id="i_genre">Genre</span></p>
      <p><label>Year:</label><span id="i_year">Year</span></p>
      <p><label>Comment:</label><span id="i_Comment">Comment</span></p>
    </div>

    <!-- Main Player Section -->
    <section id="player" class="controls">
      <div class="row">
        <a href="#">
          <img src="asset/nocover.png" loading="lazy" alt="Cover" id="cover" class="two columns album-cover" onclick="openImg(this.src);">
        </a>
        <div class="seven columns song-details">
          <header>
            <h5>
              <i id="plstate" class="ico-music state-icon"></i>
              <a href="#" id="title" onclick="sendCommand('req', 'meta');showbox('songinfo')">Title</a>
            </h5>
          </header>
          <br>
          <span id="artist" class="artist-name">Artist</span>
          <br>
          <span id="album" class="album-name">Album</span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="row progress-row">
        <div class="nine columns">
          <div class="progress-container">
            <input id="songpos" class="progress-bar" type="range" min=0 max=600000 value=23000 step=1000 oninput="seek();">
          </div>
        </div>
        <div class="three columns time-display">
          <span id="textPos" class="time-current">0:00</span>/
          <span id="textDuration" class="time-total">0:00</span>
        </div>
      </div>

      <!-- Main Control Buttons -->
      <div class="row toolbar main-controls">
        <button class="control-btn ico-to-start" onclick="sendCommand('act','previous');" title="Previous"></button>
        <button class="control-btn primary ico-pause" id="playbtn" onclick="sendCommand('act','playpause');" title="Play/Pause"></button>
        <button class="control-btn ico-stop" onclick="sendCommand('act','stop');" title="Stop"></button>
        <button class="control-btn ico-to-end" onclick="sendCommand('act','next');" title="Next"></button>
      </div>

      <!-- Secondary Controls -->
      <div class="row toolbar secondary-controls">
        <div class="dropdown">
          <button id="looping" class="control-btn ico-loop" title="Loop mode"></button>
          <div id="loopctrl" class="dropdown-content loop-dropdown">
            <input type="radio" name="loop" value="0" onclick="loopChange(this)"><label>None</label><br/>
            <input type="radio" name="loop" value="1" onclick="loopChange(this)"><label>Track</label><br/>
            <input type="radio" name="loop" value="2" onclick="loopChange(this)"><label>Album</label><br/>
            <input type="radio" name="loop" value="3" onclick="loopChange(this)"><label>Playlist</label><br/>
          </div>
        </div>

        <div class="volume-control-group">
          <button id="mute" class="control-btn ico-volume-off" onclick="toggleMute();" title="Mute"></button>
          <input id="volume" class="volume-slider" type="range" min=0 max=256 value=256 step=1 oninput="setVolume();">
          <span class="volume-label" id="volumeLabel">100%</span>
        </div>
      </div>
    </section>

    <!-- Playlist Section -->
    <br>
    <section id="playlist" class="content playlist-section">
      <div class="playlist-header">
        <h6>Playlist <span id="playlistCount" class="playlist-count">(0 tracks)</span></h6>
      </div>
      <table id="tabpl" class="playlist-table">
        <thead>
          <tr class="tabheader">
            <th>Title</th>
            <th>Artist</th>
            <th>Duration</th>
            <th>&nbsp;</th>
          </tr>
        </thead>
        <tbody id="pl-data">
        </tbody>
      </table>
    </section>

    <footer class="center footer-text">
      by Marco Caselli
    </footer>
  </div>
</body>

</html>
